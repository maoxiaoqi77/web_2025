const $=id=>document.getElementById(id);let lang=localStorage.getItem("ga9-lang")||"en";if(!langData[lang]&&lang!=="en")lang="en";let active=0;
function escapeHTML(v){return String(v).replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}
function tr(){return lang==="en"?en:langData[lang]}function contactHtml(ids){return ids.split(",").map(id=>{let c=contacts.find(q=>q.id===id);return '<div><strong>'+escapeHTML(c.name)+'</strong>'+(c.person?' · '+escapeHTML(c.person):'')+(c.phone?'<div><a href="tel:'+c.phone.replaceAll(" ","")+'">'+escapeHTML(c.phone)+'</a></div>':'')+(c.email?'<div><a href="mailto:'+escapeHTML(c.email)+'">'+escapeHTML(c.email)+'</a></div>':'')+'<div><a target="_blank" rel="noopener noreferrer" href="'+c.url+'">Official website ↗</a></div></div>'}).join("")}
function render(){let t=tr();document.documentElement.lang=lang;document.querySelectorAll("[data-lang]").forEach(b=>{b.classList.toggle("active",b.dataset.lang===lang);b.setAttribute("aria-pressed",String(b.dataset.lang===lang))});["hero","sub","overview","intro","caution","workflow","workflowIntro","directory","checktitle","checkintro","footer"].forEach(k=>$(k).textContent=t[k]);$("date").textContent="Updated 28 Oct 2026";$("projects").innerHTML=t.projects.map((p,i)=>'<article class="project"><div class="number">0'+(i+1)+'</div><h3>'+escapeHTML(p[0])+'</h3><p>'+escapeHTML(p[1])+'</p></article>').join("");$("tabs").innerHTML=t.projects.map((p,i)=>'<button aria-pressed="'+(i===active)+'" class="'+(i===active?'active':'')+'" data-project="'+i+'">'+escapeHTML(p[0])+'</button>').join("");$("steps").innerHTML=t.steps[active].map((s,i)=>'<article class="step"><div class="stephead"><div class="circle">'+(i+1)+'</div><h3>'+escapeHTML(s[0])+'</h3><span class="pill">'+escapeHTML(s[4])+'</span></div><p class="bodytext">'+escapeHTML(s[1])+'</p><div class="details"><div class="detail"><div class="caption">'+escapeHTML(t.labels[1])+'</div>'+escapeHTML(s[2])+'<p class="small">'+escapeHTML(t.times||en.times)+'</p></div><div class="detail"><div class="caption">'+escapeHTML(t.labels[2])+'</div>'+contactHtml(s[3])+'</div></div></article>').join("");$("resources").innerHTML=contacts.map(c=>'<div class="resource"><strong>'+escapeHTML(c.name)+'</strong><small>'+escapeHTML(c.person)+'</small>'+(c.phone?'<span><a href="tel:'+c.phone.replaceAll(" ","")+'">'+escapeHTML(c.phone)+'</a></span>':'')+(c.email?'<span><a href="mailto:'+escapeHTML(c.email)+'">'+escapeHTML(c.email)+'</a></span>':'')+'<a target="_blank" rel="noopener noreferrer" href="'+c.url+'">Official website ↗</a></div>').join("");$("checks").innerHTML=t.checks.map((s,i)=>'<label class="check"><input data-check="'+i+'" type="checkbox" '+(localStorage.getItem("ga9-"+i)==="1"?"checked":"")+'> '+escapeHTML(s)+'</label>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{active=+b.dataset.project;render();$("workflow").scrollIntoView({behavior:"smooth",block:"start"})}));$("checks").querySelectorAll("input").forEach(c=>c.addEventListener("change",()=>{localStorage.setItem("ga9-"+c.dataset.check,c.checked?"1":"0");progress()}));progress()}
function progress(){let t=tr(),n=t.checks.filter((_,i)=>localStorage.getItem("ga9-"+i)==="1").length;$("progress").textContent=t.done.replace("{n}",n).replace("{total}",t.checks.length)}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;localStorage.setItem("ga9-lang",lang);render()}));$("print").onclick=()=>{let t=tr();$("feedback").textContent=t.print;try{window.print()}catch(e){}};$("clear").onclick=()=>{for(let i=0;i<8;i++)localStorage.removeItem("ga9-"+i);render();$("feedback").textContent=tr().reset};render();
</script></body></html>
