<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sculpture - KIYOMI+TETSUHIRO UOZUMI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>

        /* Header 在 slideshow 上时的样式 */
        .header {
            background: transparent !important;
        }
        
        .header .logo {
            color: #fff !important;
        }
        
        .header .nav-desktop a {
            color: #fff !important;
        }
        
        .header .nav-desktop a.active {
            color: #fff !important;
        }
        
        .header .nav-desktop a:hover {
            color: #ccc !important;
        }
        
        .header .menu-btn span {
            background-color: #fff !important;
        }
        
        /* Header 滚动后的样式 */
        .header.scrolled {
            background: rgba(255, 255, 255, 0.95) !important;
        }
        
        .header.scrolled .logo {
            color: #333 !important;
        }
        
        .header.scrolled .nav-desktop a {
            color: #999 !important;
        }
        
        .header.scrolled .nav-desktop a.active {
            color: #333 !important;
        }
        
        .header.scrolled .nav-desktop a:hover {
            color: #666 !important;
        }
        
        .header.scrolled .menu-btn span {
            background-color: #333 !important;
        }
        
        main {
            padding: 0 !important;
            margin: 0 !important;
            max-width: none !important;
            width: 100%;
        }
        
        /* 全屏 Slideshow - 16:9 比例 */
        .slider {
            position: relative !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            max-width: none !important;
            overflow: hidden !important;
            z-index: 1 !important;
            background: #CCCCCC !important;
        }
        
        .slides {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        /* 隐藏切换按钮 */
        .slider-nav {
            display: none !important;
        }

        /* 内容区域样式 */
        .gallery-grid {
            margin-top: 0 !important;
            position: relative;
            z-index: 100;
            background: white;
            padding: 50px 90px !important;
            max-width: none !important;
        }

        /* Gallery specific styles */
        .gallery-section {
            margin-top: 60px;
            padding: 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.3s;
            background-color: #f5f5f5; /* 改为浅灰色背景，与drawing.html一致 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item:hover {
            opacity: 0.8;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        /* 移除webp格式图片特殊处理，统一使用cover */
        /* .gallery-item img[src$=".webp"] {
            object-fit: contain;
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
        } */
        
        /* Slider image style update */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-color: #CCCCCC; /* 浅灰色背景 */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* 防止内容溢出 */
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide img {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            object-position: center center;
            display: block;
        }

        /* 移除webp格式图片特殊处理，统一使用上面的样式 */
        /* .slide img[src$=".webp"] {
            object-fit: contain;
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
        } */
        
        /* 视频幻灯片样式 */
        .slide.video-slide {
            position: relative;
            background: #CCCCCC; /* 浅灰色背景 */
        }
        
        .slide.video-slide video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            object-position: center center;
            background: transparent;
        }
        
        /* 竖版视频特殊样式 - 现在也使用cover填充整个画面 */
        .slide.video-slide.vertical-video {
            position: relative;
        }
        
        .slide.video-slide.vertical-video video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            object-position: center center;
            background: transparent;
        }

        /* Gallery group styles */
        .gallery-group {
            margin-bottom: 60px;
        }

        .gallery-group h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: normal;
            padding-left: 20px;
        }

        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 增加iOS滚动流畅度 */
            overscroll-behavior: contain; /* 防止滚动传播 */
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            width: 1200px;
            height: 700px;
            position: relative;
            background: white;
            display: flex;
            border-radius: 8px;
            overflow: hidden;
        }

        .lightbox-image-section {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            padding: 20px;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* webp格式图片特殊处理 - 确保完整显示 */
        .lightbox-content img[src$=".webp"] {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
        }
        
        .lightbox-info-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .artwork-title {
            font-size: 24px;
            font-weight: 500;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .artwork-details {
            font-size: 14px;
            line-height: 1.6;
        }

        .artwork-details div {
            display: flex;
            margin-bottom: 8px;
            align-items: flex-start;
        }

        .artwork-details .label {
            font-weight: 500;
            width: 80px;
            flex-shrink: 0;
        }

        .artwork-details span:not(.label) {
            display: inline-block;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #333;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
            touch-action: manipulation;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: transparent;
            border: none;
            border-radius: 0;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1001;
            opacity: 0.8;
            touch-action: manipulation;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }
        
        /* 桌面端大屏：按钮距离弹框有间距 */
        @media (min-width: 1400px) {
            .lightbox.active .lightbox-prev {
                left: calc((100vw - 1200px) / 2 - 70px);
            }

            .lightbox.active .lightbox-next {
                right: calc((100vw - 1200px) / 2 - 70px);
            }
        }

        /* iPad和平板优化 (768px - 1024px) */
        @media (min-width: 768px) and (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .lightbox {
                overflow-y: auto;
                padding: 0;
                -webkit-overflow-scrolling: touch;
            }

            .lightbox.active {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .lightbox-content {
                width: 95%;
                max-width: 1000px;
                height: auto;
                max-height: none;
                flex-direction: column;
                margin: 40px auto 40px;
                overflow-y: visible;
                box-sizing: border-box;
            }

            .lightbox-image-section {
                flex: none;
                width: 100%;
                max-height: none;
                overflow-y: visible;
                padding: 20px;
                min-height: 70vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .lightbox-image-section img {
                max-width: 100%;
                max-height: 75vh;
                width: auto;
                height: auto;
                object-fit: contain;
            }

            .lightbox-info-section {
                flex: none;
                width: 100%;
                padding: 20px 20px 30px;
                overflow-y: visible;
            }

            .artwork-title {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .artwork-details {
                font-size: 15px;
            }

            .lightbox-nav {
                font-size: 48px;
                width: 60px;
                height: 60px;
            }
            
            .lightbox-prev {
                left: 15px !important;
            }

            .lightbox-next {
                right: 15px !important;
            }
            
            .lightbox-close {
                top: 20px;
                right: 20px;
                color: white;
                z-index: 1010;
                font-size: 36px;
            }
        }

        @media (max-width: 1200px) and (min-width: 1025px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .lightbox {
                overflow-y: auto;
                padding: 0;
                -webkit-overflow-scrolling: touch;
            }

            .lightbox.active {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .lightbox-content {
                width: 95%;
                height: auto;
                max-height: none;
                flex-direction: column;
                margin: 60px auto 40px;
                overflow-y: visible;
                box-sizing: border-box;
            }

            .lightbox-image-section {
                flex: none;
                width: 100%;
                max-height: none;
                overflow-y: visible;
                padding: 15px;
            }

            .lightbox-info-section {
                flex: none;
                width: 100%;
                padding: 20px 15px 30px;
                overflow-y: visible;
            }

            .artwork-title {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .artwork-details {
                font-size: 14px;
            }

            .lightbox-prev {
                left: 15px !important;
            }

            .lightbox-next {
                right: 15px !important;
            }
            
            .lightbox-close {
                top: 15px;
                right: 15px;
                color: white;
                z-index: 1010;
            }
        }

        /* 竖屏时：圆形按钮 */
        @media (max-width: 1024px) and (orientation: portrait) {
            .lightbox-nav {
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.5);
            }
            
            .lightbox-nav:hover {
                background: rgba(0, 0, 0, 0.8);
            }
        }

        /* 响应式设计 - 中等屏幕 */
        @media (max-width: 1200px) {
            
            .gallery-grid {
                padding: 40px 60px !important;
            }
        }
        
        @media (max-width: 768px) {
            
            .gallery-grid {
                padding: 30px 40px !important;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .lightbox-nav {
                font-size: 28px;
                width: 44px;
                height: 44px;
            }

            .lightbox-prev {
                left: 10px !important;
            }

            .lightbox-next {
                right: 10px !important;
            }

            .gallery-group h3 {
                font-size: 18px;
            }

            /* 保持lightbox滚动行为与平板一致 */
            .lightbox {
                overflow-y: auto;
                padding: 0;
                -webkit-overflow-scrolling: touch;
            }

            .lightbox.active {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .lightbox-content {
                flex-direction: column;
                height: auto;
                max-height: none;
                margin: 60px auto 40px;
                overflow-y: visible;
                width: 90%;
                box-sizing: border-box;
            }

            .lightbox-image-section {
                flex: none;
                width: 100%;
                max-height: none;
                overflow-y: visible;
                padding: 15px;
            }

            .lightbox-info-section {
                flex: none;
                width: 100%;
                padding: 15px 15px 30px;
                overflow-y: visible;
            }

            .artwork-title {
                font-size: 18px;
                margin-bottom: 15px;
            }

            .artwork-details {
                font-size: 13px;
                line-height: 1.8;
            }
        }

        @media (max-width: 480px) {
            
            .gallery-grid {
                padding: 20px 20px !important;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .lightbox-content {
                width: 95%;
                margin: 50px auto 30px;
                max-height: none;
            }

            .lightbox-close {
                top: 15px;
                right: 15px;
                color: white;
                z-index: 1010;
            }
        }

        /* 确保在所有设备上都能正常滚动 */
        @media (hover: none) and (pointer: coarse) {
            /* 触摸设备专用样式 */
            .lightbox {
                overflow-y: scroll;
                -webkit-overflow-scrolling: touch;
            }
            
            .lightbox.active {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
            .lightbox-content {
                margin: 60px auto 40px;
                width: 90%;
                max-width: 600px;
                height: auto;
                max-height: none;
                overflow-y: visible;
            }
        }

        /* 视频缩略图样式 */
        .video-gallery-item {
            position: relative;
        }
        
        .video-thumbnail {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
        }
        
        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .play-button i {
            color: white;
            font-size: 24px;
            margin-left: 4px; /* 稍微向右偏移，使其视觉上居中 */
        }
        
        .video-thumbnail:hover .play-button {
            background-color: rgba(0, 0, 0, 0.9);
        }
        
        /* 视频弹框样式 */
        .video-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .video-lightbox.active {
            display: flex;
        }
        
        .video-lightbox-content {
            max-width: 90%;
            max-height: 90%;
            width: 1000px;
            position: relative;
            background: black;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .video-container {
            width: 100%;
            padding-top: 56.25%; /* 16:9 宽高比 */
            position: relative;
        }
        
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .video-info {
            padding: 20px;
            color: white;
        }
        
        .video-info .artwork-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: white;
        }
        
        .video-info .artwork-year {
            font-size: 16px;
            color: #ccc;
        }
        
        .video-details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
        }
        
        .video-detail-item {
            display: flex;
            gap: 8px;
        }
        
        .video-detail-label {
            font-weight: normal;
            color: #999;
        }
        
        .video-detail-value {
            color: #ccc;
        }
        
        @media (max-width: 768px) {
            .play-button {
                width: 40px;
                height: 40px;
            }
            
            .play-button i {
                font-size: 18px;
            }
            
            .video-lightbox-content {
                width: 95%;
            }
        }
    </style>
</head>

    <script src="js/script.js"></script>
    <script>
        // 监听滚动，当离开slideshow区域时改变导航栏背景
        function updateHeaderStyle() {
            const header = document.querySelector('.header');
            const slider = document.querySelector('.slider');
            if (!header || !slider) return;
            
            const sliderHeight = slider.offsetHeight;
            const scrollPosition = window.scrollY || window.pageYOffset;
            
            // 当滚动超过slideshow高度的80%时，添加scrolled类
            if (scrollPosition > sliderHeight * 0.8) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        }
        
        window.addEventListener('scroll', updateHeaderStyle);
        window.addEventListener('resize', updateHeaderStyle);
        
        // 页面加载时也检查一次
        document.addEventListener('DOMContentLoaded', updateHeaderStyle);
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 移动端导航菜单
            const menuBtn = document.querySelector('.menu-btn');
            const navMobile = document.querySelector('.nav-mobile');
            
            if (menuBtn && navMobile) {
                menuBtn.addEventListener('click', function() {
                    menuBtn.classList.toggle('active');
                    navMobile.classList.toggle('active');
                });
            }
            

            // 随机化幻灯片顺序
            function shuffleSlides() {
                const slidesContainer = document.querySelector('.slides');
                if (!slidesContainer || slides.length === 0) return;
                
                const slidesArray = Array.from(slides);
                
                // Fisher-Yates 洗牌算法
                for (let i = slidesArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [slidesArray[i], slidesArray[j]] = [slidesArray[j], slidesArray[i]];
                }
                
                // 清空并重新添加打乱顺序的幻灯片
                slidesContainer.innerHTML = '';
                slidesArray.forEach(slide => {
                    slide.classList.remove('active');
                    slidesContainer.appendChild(slide);
                });
                
                // 显示第一张（现在是随机的第一张）
                if (slidesArray.length > 0) {
                    slidesArray[0].classList.add('active');
                }
            }

            // 幻灯片处理
            const slides = document.querySelectorAll('.slide');
            const slidesArray = Array.from(slides);
            const prevBtn = document.querySelector('.slider-nav.prev');
            const nextBtn = document.querySelector('.slider-nav.next');
            let currentIndex = 0;
            let isTransitioning = false;
            let autoSlideTimer = null;
            
            // 查找当前激活的幻灯片索引
            slidesArray.forEach((slide, index) => {
                if (slide.classList.contains('active')) {
                    currentIndex = index;
                }
            });
            
            // 切换到指定幻灯片
            function goToSlide(index) {
                if (isTransitioning) return;
                isTransitioning = true;
                
                // 清除自动轮播定时器
                clearTimeout(autoSlideTimer);
                
                // 处理循环
                if (index >= slidesArray.length) {
                    index = 0;
                } else if (index < 0) {
                    index = slidesArray.length - 1;
                }
                
                // 移除当前幻灯片的激活状态
                slidesArray[currentIndex].classList.remove('active');
                
                // 更新当前索引
                currentIndex = index;
                
                // 添加新幻灯片的激活状态
                const newSlide = slidesArray[currentIndex];
                newSlide.classList.add('active');
                
                // 设置自动轮播
                autoSlideTimer = setTimeout(() => {
                    nextSlide();
                }, 6000);
                
                // 延迟重置过渡状态
                setTimeout(() => {
                    isTransitioning = false;
                }, 800);
            }
            
            // 下一张幻灯片
            function nextSlide() {
                goToSlide(currentIndex + 1);
            }
            
            // 上一张幻灯片
            function prevSlide() {
                goToSlide(currentIndex - 1);
            }
            
            // 初始化
            function init() {
                // 随机化幻灯片顺序
                if (slides.length > 0) {
                    shuffleSlides();
                }
                
                // 设置自动轮播
                autoSlideTimer = setTimeout(() => {
                    nextSlide();
                }, 6000);
                
                // 绑定按钮事件
                if (prevBtn) {
                    prevBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        prevSlide();
                    });
                }
                
                if (nextBtn) {
                    nextBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        nextSlide();
                    });
                }
                
                // 键盘导航
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowLeft') {
                        prevSlide();
                    } else if (e.key === 'ArrowRight') {
                        nextSlide();
                    }
                });
            }
            
            // 初始化
            init();

            // Lightbox functionality
            const artworks = [
                {
                    image: "images/02sculpture/01_images/S_2017/2527_webpic_IMG_5545.webp",
                    title: "anonymous_bob with bangs",
                    year: "2017",
                    medium: "cotton, glue, brass",
                    size: "350mm, 350mm, 250mm"
                },
                {
                    image: "images/02sculpture/01_images/S_2017/2527_webpic_IMG_5562.webp",
                    title: "anonymous_braided hair",
                    year: "2017",
                    medium: "cotton, glue, brass",
                    size: "350mm, 350mm, 250mm"
                },
                {
                    image: "images/02sculpture/01_images/S_2017/2527_webpic_IMG_5573.webp",
                    title: "anonymous girl_billiards ball",
                    year: "2017",
                    medium: "cotton, glue, billiards balls",
                    size: "250mm, 500mm, 200mm"
                }
            ];
            
            let currentArtworkIndex = 0;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const artworkTitle = document.getElementById('artwork-title');
            const artworkYear = document.getElementById('artwork-year');
            const artworkMedium = document.getElementById('artwork-medium');
            const artworkSize = document.getElementById('artwork-size');
            
            window.sculptureOpenLightbox = function(index) {
                currentArtworkIndex = index;
                updateLightboxContent();
                lightbox.classList.add('active');
                
                // 重置滚动位置
                lightbox.scrollTop = 0;
                
                // 禁止背景滚动
                document.body.style.overflow = 'hidden';
            };
            
            window.sculptureCloseLightbox = function() {
                lightbox.classList.remove('active');
                
                // 恢复背景滚动
                document.body.style.overflow = '';
            };
            
            window.sculptureChangeImage = function(direction) {
                currentArtworkIndex = (currentArtworkIndex + direction + artworks.length) % artworks.length;
                updateLightboxContent();
            };
            
            function updateLightboxContent() {
                const artwork = artworks[currentArtworkIndex];
                lightboxImg.src = artwork.image;
                artworkTitle.textContent = artwork.title;
                artworkYear.textContent = artwork.year;
                artworkMedium.textContent = artwork.medium;
                artworkSize.textContent = artwork.size;
            }

            // 视频弹框功能
            window.openVideoLightbox = function(videoSrc, title, year, material, size) {
                const videoLightbox = document.getElementById('video-lightbox');
                const lightboxVideo = document.getElementById('lightbox-video');
                const videoTitle = document.getElementById('video-title');
                const videoYear = document.getElementById('video-year');
                const videoMaterial = document.getElementById('video-material');
                const videoSize = document.getElementById('video-size');
                const videoMaterialContainer = document.getElementById('video-material-container');
                const videoSizeContainer = document.getElementById('video-size-container');
                
                // 设置视频源 - 确保路径正确
                const sources = lightboxVideo.querySelectorAll('source');
                
                // 使用原始路径（GitHub Pages应该能处理相对路径）
                const actualVideoSrc = videoSrc;
                const videoType = actualVideoSrc.endsWith('.mov') ? 'video/quicktime' : 'video/mp4';
                
                // 设置两个source元素（提供兼容性）
                sources[0].src = actualVideoSrc;
                sources[0].type = videoType;
                if (sources[1]) {
                    sources[1].src = actualVideoSrc;
                    sources[1].type = videoType;
                }
                
                // 清空之前可能的错误和加载状态
                lightboxVideo.removeAttribute('poster');
                lightboxVideo.currentTime = 0;
                
                // 添加错误处理
                lightboxVideo.onerror = function(e) {
                    console.error('视频加载失败:', {
                        src: actualVideoSrc,
                        error: lightboxVideo.error,
                        code: lightboxVideo.error ? lightboxVideo.error.code : 'unknown'
                    });
                };
                
                // 添加加载事件监听
                lightboxVideo.onloadstart = function() {
                    console.log('开始加载视频:', actualVideoSrc);
                };
                
                lightboxVideo.oncanplay = function() {
                    console.log('视频可以播放:', actualVideoSrc);
                };
                
                lightboxVideo.oncanplaythrough = function() {
                    console.log('视频完全加载:', actualVideoSrc);
                };
                
                // 重新加载视频
                try {
                    lightboxVideo.load();
                } catch (error) {
                    console.error('加载视频时出错:', error);
                }
                
                // 设置标题和年份
                videoTitle.textContent = title;
                videoYear.textContent = year;
                
                // 设置材料信息
                if (material) {
                    videoMaterial.textContent = material;
                    videoMaterialContainer.style.display = 'flex';
                } else {
                    videoMaterialContainer.style.display = 'none';
                }
                
                // 设置尺寸信息
                if (size) {
                    videoSize.textContent = size;
                    videoSizeContainer.style.display = 'flex';
                } else {
                    videoSizeContainer.style.display = 'none';
                }
                
                // 显示弹框
                videoLightbox.classList.add('active');
                
                // 禁止背景滚动
                document.body.style.overflow = 'hidden';
                
                // 自动播放视频
                lightboxVideo.play().catch(error => {
                    console.error('视频自动播放失败:', error);
                });
            };

            window.closeVideoLightbox = function() {
                const videoLightbox = document.getElementById('video-lightbox');
                const lightboxVideo = document.getElementById('lightbox-video');
                
                // 暂停视频
                lightboxVideo.pause();
                
                // 隐藏弹框
                videoLightbox.classList.remove('active');
                
                // 恢复背景滚动
                document.body.style.overflow = '';
            };

            // 键盘事件监听
            document.addEventListener('keydown', function(e) {
                const videoLightbox = document.getElementById('video-lightbox');
                if (videoLightbox && videoLightbox.classList.contains('active') && e.key === 'Escape') {
                    closeVideoLightbox();
                }
            });
        });
    </script>
